include classpath("application.conf")

node-address {
    protocol = http
    host = "127.0.0.1"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    yirang-dead-letters {
        defaultVisibilityTimeout = 5 seconds
    }

    yirang-pc-001 {
        defaultVisibilityTimeout = 5 seconds
        deadLettersQueue {
            name = "yirang-dead-letters"
            maxReceiveCount = 5
        }
    }

    yirang-pc-002 {
        defaultVisibilityTimeout = 5 seconds
        deadLettersQueue {
            name = "yirang-dead-letters"
            maxReceiveCount = 5
        }
    }

    yirang-results {
        defaultVisibilityTimeout = 5 seconds
    }

    yirang-integration {
        defaultVisibilityTimeout = 5 seconds
    }
}
