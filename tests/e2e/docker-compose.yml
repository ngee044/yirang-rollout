name: yirang-e2e

services:
  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"

  queue:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:9324:9324"
